name: Test Sút Bóng TV

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Sút Bóng TV updater
        run: python scripts/update.py
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sutbongtv-test-results
          path: |
            thethao.m3u
            epg.xml
            sources.json
            referer_cache.json
          if-no-files-found: warn
